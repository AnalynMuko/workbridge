databases:
  - name: workbridge-db
    plan: starter
    region: oregon
    engine: postgres
    version: 15

services:
  - type: web
    name: workbridge
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: workbridge-db
      - key: SESSION_SECRET
        value: "replace_with_a_secret_value"
