services:
  - type: database
    name: workbridge-db
    plan: starter
    region: oregon
    databaseName: workbridge

  - type: web
    name: workbridge
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workbridge-db
          property: connectionString
      - key: DB_DIALECT
        value: postgres
      - key: SESSION_SECRET
        value: "replace_with_a_secret_value"
